<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta - La Mansión</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;text-align:center}
header{padding:20px;background:#000;border-bottom:3px solid #d4af37}
.logo{max-width:180px;border-radius:12px}
h1{color:#d4af37}
#wheel{width:320px;height:320px;border-radius:50%;
background:conic-gradient(
#b8860b 0 36deg,#222 36deg 72deg,#8b0000 72deg 108deg,#222 108deg 144deg,
#b8860b 144deg 180deg,#222 180deg 216deg,#8b0000 216deg 252deg,#222 252deg 288deg,
#b8860b 288deg 324deg,#222 324deg 360deg);
margin:20px auto;border:8px solid #d4af37;
transition:transform 5s cubic-bezier(.17,.67,.25,1)}
button{padding:14px 26px;font-size:18px;background:#d4af37;border:none;border-radius:8px;cursor:pointer}
#result{margin:20px;font-size:20px}
.small{max-width:700px;margin:auto;padding:20px;color:#ddd}
</style>
</head>
<body>
<header>
<h1>🎡 Juega y gana solo en La Mansión</h1>
<p>Reemplaza la imagen logo.png por tu logo o edita el HTML.</p>
<img class="logo" src="logo.png" onerror="this.style.display='none'">
</header>

<div id="wheel"></div>
<button onclick="spin()">GIRAR</button>

<div id="result"></div>

<div class="small">
<b>Condiciones</b><br>
• Un giro por visita.<br>
• Un intento por cliente.<br>
• Envía la captura inmediatamente al WhatsApp 74041087.<br>
• Reclama el premio el mismo día.
</div>

<script>
const premios=[
["🍺 1 Paceñita",10],
["Sigue participando",30],
["20% de descuento",15],
["Será la siguiente",10],
["⏰ 1 Hora Gratis",5],
["🧢 Gorra",5],
["🍷 1 Copa Sucia",7],
["Sigue participando",10],
["🔑 Llavero",8]
];

function elegir(){
 let total=premios.reduce((a,b)=>a+b[1],0);
 let r=Math.random()*total;
 let s=0;
 for(let p of premios){
   s+=p[1];
   if(r<=s) return p[0];
 }
 return premios[0][0];
}
function codigo(){
 return "LM-"+Math.random().toString(36).substring(2,8).toUpperCase();
}
let ang=0;
function spin(){
 ang+=1800+Math.random()*360;
 document.getElementById("wheel").style.transform="rotate("+ang+"deg)";
 setTimeout(()=>{
   const premio=elegir();
   const cod=codigo();
   document.getElementById("result").innerHTML=
   "<h2>"+premio+"</h2><p>Código: <b>"+cod+
   "</b></p><button onclick='wa(`"+premio+"`,`"+cod+"`)'>Enviar a WhatsApp</button>";
 },5000);
}
function wa(p,c){
 const msg=encodeURIComponent("Hola, jugué en la Ruleta de La Mansión.%0APremio: "+p+"%0ACódigo: "+c+"%0AAdjunto captura.");
 window.open("https://wa.me/59174041087?text="+msg,"_blank");
}
</script>
</body>
</html>
